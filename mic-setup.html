<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allow microphone — md telescribe</title>
  <link rel="stylesheet" href="extension-ui.css" />
</head>
<body class="mic-setup-page">
  <div class="mic-setup-card">
    <header class="brand-header" style="padding: 0;">
      <img src="icons/logo.png" alt="md telescribe" class="brand-logo-full" style="height: 64px;" />
    </header>

    <h1>Allow microphone</h1>
    <p>
      Click the button below. Chrome will show a permission dialog at the top of the browser —
      choose <strong>Allow</strong>.
    </p>
    <button id="allowBtn" type="button" class="btn btn-primary">Allow microphone</button>
    <p id="status" class="status" aria-live="polite"></p>
    <p class="hint">
      If Chrome already shows Allow but recording still fails, open Windows Settings →
      Privacy → Microphone and make sure <strong>Google Chrome</strong> is enabled.
    </p>
  </div>
  <script src="mic-setup.js"></script>
</body>
</html>
